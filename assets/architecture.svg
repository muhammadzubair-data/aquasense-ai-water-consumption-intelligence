<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="AquaSense AI system architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04101F"/><stop offset="1" stop-color="#0B2340"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1200" height="560" rx="22" fill="url(#bg)"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="50" font-size="13" font-weight="700" letter-spacing="3" fill="#22D3EE">AQUASENSE AI · SYSTEM ARCHITECTURE</text>
    <text x="40" y="78" font-size="22" font-weight="800" fill="#F8FAFC">From raw meter readings to signals worth a site visit</text>
    <g font-size="12" font-weight="700" letter-spacing="1.5" fill="#64748B">
      <text x="40" y="122">INPUT</text><text x="310" y="122">PREPARATION</text><text x="570" y="122">ANALYTICS CORE · aquasense/core.py</text><text x="940" y="122">STREAMLIT APP · app.py</text>
    </g>
    <rect x="40" y="140" width="240" height="80" rx="14" fill="#0EA5E9" fill-opacity=".14" stroke="#0EA5E9"/>
    <text x="58" y="172" font-size="16" font-weight="700" fill="#BAE6FD">Synthetic generator</text>
    <text x="58" y="196" font-size="12.5" fill="#CBD5E1">original or realistic · injected truth</text>
    <rect x="40" y="240" width="240" height="80" rx="14" fill="#14B8A6" fill-opacity=".14" stroke="#14B8A6"/>
    <text x="58" y="272" font-size="16" font-weight="700" fill="#99F6E4">CSV upload</text>
    <text x="58" y="296" font-size="12.5" fill="#CBD5E1">≤ 25 MB · session memory only</text>

    <rect x="310" y="140" width="230" height="180" rx="14" fill="#0B2340" stroke="#94A3B8" stroke-opacity=".45"/>
    <text x="328" y="170" font-size="16" font-weight="700" fill="#F8FAFC">prepare()</text>
    <g font-size="12.5" fill="#CBD5E1">
      <text x="328" y="196">• header &amp; unit mapping (m³, gal)</text>
      <text x="328" y="218">• local-clock timestamp parsing</text>
      <text x="328" y="240">• meter-ID, volume, sign checks</text>
      <text x="328" y="262">• duplicates removed / merged</text>
      <text x="328" y="284">• sub-hourly → hourly totals</text>
      <text x="328" y="306">• gaps ≤ 3 h interpolated</text>
    </g>

    <g>
      <rect x="570" y="140" width="340" height="50" rx="12" fill="#6366F1" fill-opacity=".16" stroke="#818CF8"/>
      <text x="588" y="162" font-size="15" font-weight="700" fill="#E0E7FF">Consumption analytics</text>
      <text x="588" y="181" font-size="11.5" fill="#CBD5E1">daily · hourly · weekday×hour · meter summary · night flow</text>
      <rect x="570" y="198" width="340" height="50" rx="12" fill="#6366F1" fill-opacity=".16" stroke="#818CF8"/>
      <text x="588" y="220" font-size="15" font-weight="700" fill="#E0E7FF">detect_anomalies()</text>
      <text x="588" y="239" font-size="11.5" fill="#CBD5E1">Isolation Forest on gap from the typical hour</text>
      <rect x="570" y="256" width="340" height="50" rx="12" fill="#6366F1" fill-opacity=".16" stroke="#818CF8"/>
      <text x="588" y="278" font-size="15" font-weight="700" fill="#E0E7FF">potential_leaks()</text>
      <text x="588" y="297" font-size="11.5" fill="#CBD5E1">sustained excess → episodes → night-flow priority</text>
      <rect x="570" y="314" width="340" height="50" rx="12" fill="#6366F1" fill-opacity=".16" stroke="#818CF8"/>
      <text x="588" y="336" font-size="15" font-weight="700" fill="#E0E7FF">evaluate_forecast()</text>
      <text x="588" y="355" font-size="11.5" fill="#CBD5E1">Random Forest · chronological holdout · baselines</text>
    </g>

    <rect x="940" y="140" width="230" height="250" rx="14" fill="#0B2340" stroke="#14B8A6" stroke-opacity=".7"/>
    <g font-size="12.5" fill="#E2E8F0">
      <text x="958" y="168">💧 Command Center</text>
      <text x="958" y="195">📊 Consumption Analytics</text>
      <text x="958" y="222">🔍 Anomaly Detection</text>
      <text x="958" y="249">🚰 Potential Leak Intelligence</text>
      <text x="958" y="276">📈 Demand Forecasting</text>
      <text x="958" y="303">🔢 Meter Intelligence</text>
      <text x="958" y="330">🗂️ Data Explorer</text>
      <text x="958" y="357">📘 Methodology</text>
    </g>
    <text x="958" y="380" font-size="11.5" fill="#64748B">light / dark · Plotly · exports</text>

    <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path d="M280 180 H 306"/><path d="M280 280 H 306"/>
      <path d="M540 165 H 566"/><path d="M540 223 H 566"/><path d="M540 281 H 566"/><path d="M540 300 C 555 300 552 339 566 339"/>
      <path d="M910 165 H 936"/><path d="M910 223 H 936"/><path d="M910 281 H 936"/><path d="M910 339 H 936"/>
    </g>

    <rect x="40" y="420" width="1130" height="110" rx="16" fill="#F59E0B" fill-opacity=".08" stroke="#F59E0B" stroke-opacity=".5"/>
    <text x="62" y="452" font-size="14" font-weight="700" letter-spacing="1" fill="#FDE68A">CACHING, ISOLATION AND HONESTY</text>
    <g font-size="13" fill="#E2E8F0">
      <text x="62" y="480">• Demo data and results: st.cache_data / st.cache_resource with bounded entries and a 1-hour TTL.</text>
      <text x="62" y="504">• Uploaded data and every result computed from it: st.session_state only (max 12 results), never shared, never written to disk.</text>
      <text x="62" y="524" fill="#CBD5E1">• Every page labels anomalies as unusual readings and leak episodes as potential indicators; nothing claims a confirmed leak.</text>
    </g>
  </g>
</svg>
