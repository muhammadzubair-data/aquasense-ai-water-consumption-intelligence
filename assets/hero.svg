      <rect x="254" y="262" width="158" height="32" rx="16" fill="#14B8A6" fill-opacity=".18" stroke="#14B8A6" stroke-opacity=".6"/>
      <text x="333" y="283" text-anchor="middle" fill="#99F6E4">ISOLATION FOREST</text>
      <rect x="424" y="262" width="150" height="32" rx="16" fill="#10B981" fill-opacity=".18" stroke="#10B981" stroke-opacity=".6"/>
      <text x="499" y="283" text-anchor="middle" fill="#A7F3D0">RANDOM FOREST</text>
    </g>
    <text x="64" y="330" font-size="14" fill="#FDE68A">◆ Synthetic demonstration data — signals to check, not confirmed leaks</text>
  </g>
