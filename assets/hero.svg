    <rect x="18" y="146" width="66" height="34" rx="6" fill="#F43F5E" fill-opacity=".16" stroke="#F43F5E" stroke-opacity=".6"/>
    <text x="22" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FDA4AF">night flow ↑</text>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#CBD5E1">
      <line x1="20" y1="215" x2="38" y2="215" stroke="url(#brand)" stroke-width="3"/><text x="44" y="219">observed</text>
      <line x1="110" y1="215" x2="128" y2="215" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4"/><text x="134" y="219">typical for the hour</text>
