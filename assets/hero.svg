    <text x="20" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94A3B8">HOURLY FLOW · ONE METER</text>
    <path d="M20 190 L40 196 L60 198 L80 192 L100 140 L120 118 L140 150 L160 158 L180 132 L200 120 L230 160" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5"/>
