    <path d="M48 128 c14 10 30 10 47 0 s33 -10 47 0" fill="none" stroke="#071A33" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 150 c11 7 24 7 37 0 s26 -7 37 0" fill="none" stroke="#071A33" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  </g>
  <g transform="translate(905,70)">
