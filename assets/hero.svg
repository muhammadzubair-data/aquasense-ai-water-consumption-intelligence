    <radialGradient id="g1" cx=".06" cy=".05" r=".55"><stop offset="0" stop-color="#22D3EE" stop-opacity=".36"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx=".95" cy=".95" r=".6"><stop offset="0" stop-color="#10B981" stop-opacity=".32"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0EA5E9"/><stop offset=".5" stop-color="#14B8A6"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".6" stop-color="#14B8A6"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="400" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
